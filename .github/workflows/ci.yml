name: CI

env:
  ZIG_VERSION: '0.16.0'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Required memory-safety gate (kept separate) ──
  memory-safety:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (Node 24)
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with: { node-version: '24' }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache pinned Ghostty native archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: apps/daemon/.ghostty-vt
          key: ghostty-native-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('scripts/ghostty-source.ts', 'scripts/build-ghostty-vt-native.ts') }}
      - run: pnpm install --frozen-lockfile
      - name: Zig lint, format, and unit tests
        run: pnpm zig:check
      - name: Daemon runtime check (isolated HOME)
        run: |
          set -euo pipefail
          PETTYD_CI_HOME="$(mktemp -d)"
          trap 'rm -rf "$PETTYD_CI_HOME"' EXIT
          HOME="$PETTYD_CI_HOME" pnpm --filter @petty/daemon check
      - name: Daemon leak check
        run: pnpm zig:leak-check
  # ── Frontend quality; macOS memory-safety runs the daemon tests ──
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PETTYD_SKIP_NATIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (Node 24)
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with: { node-version: '24' }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache pinned Ghostty WASM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            apps/desktop/public/ghostty-vt.wasm
            apps/desktop/public/ghostty-vt.revision
            apps/desktop/public/ghostty-vt-LICENSE.txt
          key: ghostty-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('scripts/ghostty-source.ts', 'scripts/build-ghostty-vt-wasm.ts') }}
      - run: pnpm install --frozen-lockfile
      - name: Lint (TypeScript + Zig)
        run: pnpm lint
      - name: Format check (TypeScript + Zig)
        run: pnpm fmt:check
      - name: TypeScript type check
        run: pnpm tsc
      - name: Persistence and tooling tests
        run: pnpm test
      - name: Electron terminal surface correctness (software display)
        timeout-minutes: 3
        run: |
          if ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          Xvfb :97 -screen 0 1280x800x24 -nolisten tcp &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          # Xvfb starts asynchronously; wait for its socket before launching Electron.
          for _ in $(seq 50); do
            [ -S /tmp/.X11-unix/X97 ] && break
            kill -0 "$xvfb_pid" 2>/dev/null || { echo "Xvfb exited"; exit 1; }
            sleep 0.1
          done
          [ -S /tmp/.X11-unix/X97 ] || { echo "Xvfb did not start"; exit 1; }
          export DISPLAY=:97
          pnpm test:surface

  # ── Build matrix across platforms ──
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: petty-dist-ubuntu
            skip_native: '1'
          - os: macos-15
            artifact: petty-dist-macos
          - os: windows-latest
            artifact: petty-dist-windows
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (Node 24)
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with: { node-version: '24' }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache pinned Ghostty native archive
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: apps/daemon/.ghostty-vt
          key: ghostty-native-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('scripts/ghostty-source.ts', 'scripts/build-ghostty-vt-native.ts') }}
      - name: Cache pinned Ghostty WASM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            apps/desktop/public/ghostty-vt.wasm
            apps/desktop/public/ghostty-vt.revision
            apps/desktop/public/ghostty-vt-LICENSE.txt
          key: ghostty-wasm-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('scripts/ghostty-source.ts', 'scripts/build-ghostty-vt-wasm.ts') }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          PETTYD_SKIP_NATIVE: ${{ matrix.skip_native }}
      - name: esbuild-compiled Electron benchmark smoke
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: pnpm --filter @petty/desktop bench:addons
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: matrix.artifact != 'petty-dist-windows'
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/out/
